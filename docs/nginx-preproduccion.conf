# Ejemplo de servidor Nginx para el ambiente de preproducción (Laravel).
# Ruta de la aplicación desplegada: /var/www/preproduccion/laravel-release
server {
    listen 80;
    server_name preproduccion.local;
    root /var/www/preproduccion/laravel-release/public;

    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Nunca exponer archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
